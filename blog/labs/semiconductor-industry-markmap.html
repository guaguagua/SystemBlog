# 芯片行业全景 · 从沙粒到系统

## ① 半导体材料
- 晶圆与衬底
  - 硅基材料
    - 单晶硅锭：直拉 CZ / 区熔 FZ
    - 抛光硅片：150 / 200 / 300 mm
    - 外延片 Epi：控制掺杂与缺陷
    - SOI：RF-SOI / FD-SOI / Power-SOI
    - 代表供应商：Shin-Etsu / SUMCO / GlobalWafers / Siltronic / SK Siltron
  - 宽禁带半导体
    - SiC 碳化硅：导电型 / 半绝缘型
    - GaN 氮化镓：GaN-on-Si / SiC / Sapphire
    - 氧化镓 Ga₂O₃ / 金刚石：超宽禁带探索
    - SiC 衬底代表：Wolfspeed / Coherent / ROHM SiCrystal / ST / onsemi
  - III-V 族化合物
    - GaAs：射频 PA / 光电
    - InP：高速光通信 / 毫米波
    - GaSb / InAs：红外与特种器件
  - 其他衬底
    - 蓝宝石：LED / GaN 外延
    - 石英与玻璃：掩模 / 先进封装
    - 陶瓷：Al₂O₃ / AlN / Si₃N₄
- 图形化材料
  - 光掩模与掩模版
    - 石英掩模基板 / 铬膜
    - DUV 光掩模 / EUV 反射式掩模
    - 掩模保护膜 Pellicle
    - 代表供应商：Hoya / DNP / Toppan / Photronics / Shin-Etsu
  - 光刻胶 Photoresist
    - 正胶 / 负胶
    - KrF 248 nm / ArF 193 nm
    - ArF 浸没式 / EUV 胶
    - 电子束胶 / 纳米压印胶
    - 代表供应商：JSR / TOK / Shin-Etsu / Fujifilm / DuPont
  - 配套材料 Ancillaries
    - 显影液 TMAH / 去胶剂
    - 底部抗反射层 BARC
    - 顶涂层 / 增粘剂 HMDS
- 薄膜、互连与掺杂材料
  - 介质与绝缘层
    - SiO₂ / SiN / Low-k / Ultra-low-k
    - High-k：HfO₂ 等
  - 导体与阻挡层
    - 铜 Cu / 铝 Al / 钨 W / 钴 Co / 钌 Ru
    - Ta / TaN / Ti / TiN
  - 沉积源材料
    - 溅射靶材：Cu / Al / Ti / Ta / W
    - 金属有机与 ALD / CVD 前驱体
  - 掺杂源
    - 硼 B / 磷 P / 砷 As
    - 离子注入源与扩散源
- 电子气体
  - 大宗气体
    - N₂ / O₂ / H₂ / Ar / He
  - 特种与反应气体
    - 沉积：SiH₄ / NH₃ / WF₆ / N₂O
    - 刻蚀：CF₄ / C₄F₆ / SF₆ / Cl₂ / HBr
    - 清洁：NF₃ / F₂
    - 掺杂：BF₃ / PH₃ / AsH₃
  - 光刻相关
    - 氖 Ne / 氩 Ar / 氪 Kr / 氙 Xe
  - 代表供应商：Linde / Air Liquide / Air Products / Merck / Taiyo Nippon Sanso
- 湿电子化学品
  - 清洗：H₂SO₄ / H₂O₂ / NH₄OH / HCl
  - 刻蚀：HF / H₃PO₄ / KOH
  - 溶剂：IPA / PGMEA / NMP 替代体系
  - 电镀液：铜 / 镍 / 锡银
  - 代表供应商：Entegris / Kanto Chemical / BASF / Honeywell / Stella Chemifa
- 工艺水与污染控制材料
  - 超纯水 UPW / 离子交换树脂
  - 化学品与气体过滤器 / 膜材料
  - 晶圆盒 / FOUP / 洁净室耗材
- CMP 材料
  - 抛光液 Slurry：氧化物 / 钨 / 铜
  - 抛光垫 Pad / 修整盘
  - 清洗液与后 CMP 化学品
  - 代表供应商：Entegris / DuPont / Fujimi / Resonac / AGC
- 封装材料
  - 载体与互连
    - 引线框架 Leadframe
    - 有机封装基板 ABF / BT
    - 硅 / 玻璃中介层 Interposer
    - 键合线：Cu / Au / Al
  - 连接与保护
    - 焊球 / 微凸点 / 铜柱
    - 底部填充 Underfill
    - 塑封料 EMC / 液态封装料
    - 固晶胶 / 烧结银 / 热界面材料 TIM
  - 工艺辅材
    - 切割胶带 / UV 胶带
    - 临时键合与解键合材料
  - 代表供应商：Ajinomoto / Resonac / Sumitomo Bakelite / Ibiden / Shinko / Kyocera

## ② 半导体设备
- 晶圆制造与衬底设备
  - 单晶炉 / 长晶炉
  - 切片 / 倒角 / 研磨 / 抛光
  - 外延炉：Si / SiC / GaN
  - 晶圆清洗与缺陷检测
- 掩模版设备
  - 激光 / 电子束掩模写入
  - 掩模涂胶显影 / 刻蚀 / 清洗
  - 掩模 CD 量测 / 缺陷检测 / 修复
- 晶圆前道设备 WFE
  - 清洗与表面处理
    - 槽式湿法 / 单片清洗 / 超临界干燥
    - 去胶 Ashing / 湿法剥离
  - 涂胶显影 Track
    - 涂胶 / 烘烤 / 显影 / 边缘去胶
  - 光刻曝光
    - i-line / KrF / ArF 干式
    - ArF 浸没式 DUV
    - EUV / High-NA EUV
    - 纳米压印 / 直写（特定场景）
    - 代表厂商：ASML / Nikon / Canon
  - 薄膜沉积
    - PVD 物理气相沉积 / 溅射
    - CVD：LPCVD / PECVD / MOCVD
    - ALD：热 ALD / PEALD
    - 外延 Epitaxy
    - 电化学沉积 ECD
    - 代表厂商：Applied Materials / Lam Research / Tokyo Electron / ASM / Kokusai / AIXTRON
  - 刻蚀
    - 干法等离子：RIE / ICP / ALE
    - 湿法刻蚀
    - 深硅刻蚀 DRIE / 高深宽比刻蚀
    - 代表厂商：Lam Research / Tokyo Electron / Applied Materials / AMEC / Hitachi High-Tech
  - 掺杂与热处理
    - 离子注入：低 / 中 / 高能
    - 扩散炉 / 氧化炉
    - 快速热处理 RTP / 激光退火
    - 代表厂商：Axcelis / Applied Materials / Kokusai / Tokyo Electron / SCREEN
  - 平坦化
    - CMP 抛光设备
    - 刷洗与后 CMP 清洗
    - 代表厂商：Applied Materials / Ebara
  - 量测与检测 Metrology & Inspection
    - 光学缺陷检测 / 明暗场
    - 电子束检测 EBI / SEM Review
    - CD-SEM / OCD / Overlay
    - 膜厚 / 应力 / 颗粒 / 成分量测
    - 探针式 / AFM / X-ray
    - 代表厂商：KLA / Applied Materials / Hitachi High-Tech / Onto Innovation / Nova
- 工厂设施与自动化
  - 晶圆搬运
    - FOUP / Load Port / EFEM
    - AMHS 天车 OHT / Stocker
    - 晶圆机器人 / 对准器
  - 核心子系统
    - 真空泵 / 阀门 / 射频电源
    - 精密运动平台 / 激光器 / 光学系统
    - 温控 Chiller / 过滤器 / 密封件
  - 厂务系统 Facilities
    - 洁净室 / HVAC / 防微振
    - 超纯水 / 特气与化学品输送
    - 电力 / 冷却水 / 排气 / 废气治理
  - 智能制造
    - MES / APC / FDC / EAP
    - 设备通信 SECS/GEM
    - 良率管理 YMS / 预测维护
- 封装组装设备
  - 晶圆减薄 / 背磨 / 临时键合
  - 划片：刀片 / 激光 / 等离子
  - 固晶 Die Attach / Flip-Chip Bonder
  - 引线键合 Wire Bonding
  - 混合键合 Hybrid Bonding
  - 植球 / 凸点 / 电镀 / 回流焊
  - 塑封 / 底填 / 固化 / 打标
  - 基板与 RDL 制造设备
  - 代表厂商：DISCO / ASMPT / BESI / Kulicke & Soffa / TOWA / Hanmi
- 测试设备
  - 晶圆测试
    - 探针台 Prober / 探针卡 Probe Card
    - ATE 自动测试机：SoC / Memory / RF / Power
  - 成品测试
    - Handler 分选机 / 测试座 Socket
    - Burn-in 老化 / SLT 系统级测试
  - 可靠性与失效分析
    - 温循 / HAST / 功率循环
    - X-ray / SAM / FIB / TEM / 发光分析
  - 代表厂商：Advantest / Teradyne / Cohu / Tokyo Seimitsu / FormFactor

## ③ 芯片设计
- 设计流程
  - 产品定义与规格
    - 市场与应用需求 / PPA 目标
    - 接口、算力、功耗、安全、可靠性
    - 工艺节点 / 成本 / 封装 / 上市时间
  - 系统与架构设计
    - 系统划分：软硬件协同
    - ISA 指令集：Arm / x86 / RISC-V
    - 微架构 / 存储层次 / NoC
    - Chiplet 划分与 UCIe 等互连
    - 功耗、时钟、复位、安全架构
  - IP 复用与开发
    - 按交付形态
      - Soft IP 软核
        - 可综合 RTL 源码
        - 参数可配置，工艺可移植
        - 常见于 CPU、总线控制器、数字算法模块
      - Firm IP 固核
        - 已优化门级网表与时序约束
        - PPA 较确定，仍保留有限工艺适配能力
      - Hard IP 硬核
        - 版图 GDS、抽取模型与时序功耗模型
        - 与晶圆厂、工艺节点和 PVT 条件绑定
        - 常见于 PHY、SerDes、PLL、模拟与存储器 IP
      - Subsystem IP 子系统
        - 多个 IP 预集成、预验证
        - 配套固件、驱动、参考设计与验证环境
      - Verification IP 验证 IP
        - 协议模型、UVM 组件与总线功能模型
        - 断言、覆盖率模型与协议检查器
    - 计算 IP
      - CPU 处理器核
        - Arm Cortex、Neoverse
        - RISC-V 处理器核
        - MCU 微控制器核
      - DSP 数字信号处理器
        - 音频与语音 DSP
        - 通信与基带 DSP
        - 视觉与雷达 DSP
      - GPU 图形处理器
        - 图形渲染
        - 通用并行计算
      - NPU 与 AI 加速器
        - 矩阵与张量计算
        - 端侧推理与神经网络引擎
      - 专用加速器
        - 视频编解码引擎
        - 密码运算引擎
        - 数据压缩与正则表达式引擎
    - 系统基础设施 IP
      - 片上互连
        - AMBA AXI、AHB、APB
        - ACE、CHI 一致性互连
        - NoC 片上网络与 QoS
      - 缓存与内存系统
        - 系统级缓存 SLC
        - Cache Coherent Hub
        - DMA 与内存搬运引擎
      - 系统控制
        - 中断控制器与定时器
        - 时钟、复位与电源控制器
        - 电源域、隔离与低功耗握手
      - 地址与访问管理
        - IOMMU 与 SMMU
        - 地址转换与内存保护
      - 调试与可观测性
        - JTAG 与片上调试
        - Trace 追踪与性能监视器
    - 基础与存储器 IP
      - 标准单元库
        - 多阈值电压单元
        - 高密度、高性能与低功耗库
        - 时序、功耗、噪声与版图视图
      - 嵌入式存储器
        - SRAM Compiler
        - ROM 与 Register File
        - Cache Tag 与多端口存储器
      - 嵌入式非易失存储器
        - eFuse 与 OTP
        - eFlash、MRAM 与 ReRAM
      - I/O 与物理基础库
        - GPIO 与 Pad Library
        - ESD、Level Shifter 与 Isolation Cell
        - PVT Monitor 与片上传感器
    - 接口控制器与 PHY IP
      - 存储器接口
        - DDR、LPDDR 控制器与 PHY
        - HBM 控制器与 PHY
        - GDDR 控制器与 PHY
      - 芯片与系统互连
        - PCIe 控制器、SerDes 与 PHY
        - CXL 控制器与协议栈
        - UCIe 与 Die-to-Die PHY
      - 存储设备接口
        - UFS、eMMC 与 SD
        - SATA 与 NVMe 控制器
      - 移动与外设接口
        - USB 与 Thunderbolt
        - MIPI CSI、DSI 与 C-PHY、D-PHY
        - I3C、I2C、SPI 与 UART
        - CAN、LIN 与车载以太网
      - 网络与通信接口
        - Ethernet MAC、PCS 与 PHY
        - TSN 时间敏感网络
        - Interlaken 与高速串行链路
    - 模拟与混合信号 IP
      - 时钟生成
        - PLL、DLL 与振荡器
        - Clock Generator 与抖动清理
      - 数据转换
        - ADC 与 DAC
        - 高速、精密与低功耗转换器
      - 电源管理
        - LDO 与 DC-DC
        - PMIC 控制与电源监测
      - 高速收发
        - SerDes、CDR 与均衡器
        - 发送驱动与接收前端
      - 传感器前端
        - AFE 模拟前端
        - 温度、电压与工艺监测
    - 安全 IP
      - 硬件信任根
        - Root of Trust
        - Secure Enclave 与安全控制器
      - 密码算法引擎
        - AES、SHA、RSA 与 ECC
        - 后量子密码 PQC
        - TRNG 与密钥派生
      - 身份与密钥
        - Secure Boot
        - Key Vault、eFuse 与 OTP
        - PUF 物理不可克隆函数
      - 系统防护
        - 安全总线与访问防火墙
        - 内存保护与可信执行环境
        - 防篡改、侧信道与故障注入防护
    - 多媒体与传感器 IP
      - ISP 图像信号处理器
      - 视频编码与解码器
      - 显示控制器与合成引擎
      - 音频编解码与语音处理
      - 计算机视觉与传感器融合
    - 测试、安全与可靠性 IP

    - 冗余 Lane、链路降级与故障隔离
  - 系统能力
    - 热插拔、即插即用与设备发现
    - QoS、虚拟化、缓存一致性与安全
    - 控制器、PHY、连接器、线缆与软件驱动生态
  </script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view"></script>
  <script>
    const markdown=document.querySelector('#markdown').textContent.trim();
    const {Transformer,Markmap}=window.markmap;const transformer=new Transformer();const {root}=transformer.transform(markdown);
    const mm=Markmap.create('#mindmap',{autoFit:true,duration:420,maxWidth:260,spacingHorizontal:92,spacingVertical:9,paddingX:14,colorFreezeLevel:2,initialExpandLevel:2},root);window.industryMap=mm;
    document.querySelector('#mindmap').addEventListener('click',event=>{const target=event.target,node=target?.closest?.('g.markmap-node');if(!node||target.closest?.('circle'))return;const circle=node.querySelector('circle');if(circle)circle.dispatchEvent(new MouseEvent('click',{bubbles:true,clientX:event.clientX,clientY:event.clientY}))});
    const walk=(node,fn,path=[])=>{fn(node,path);(node.children||[]).forEach(c=>walk(c,fn,[...path,node]));};
    let currentLevel=2;
    function setLevel(level,remember=true){if(remember)currentLevel=level;const expandLevel=level>20?-1:level,freshRoot=transformer.transform(markdown).root;Promise.resolve(mm.setData(freshRoot,{initialExpandLevel:expandLevel})).then(()=>mm.fit());document.querySelectorAll('[data-level]').forEach(b=>b.classList.toggle('active',+b.dataset.level===level));document.querySelector('#status').textContent=level>20?'全部展开':`展开至第 ${level} 层`;}
    document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>setLevel(+b.dataset.level));
    document.querySelector('#fit').onclick=()=>mm.fit();
    const strip=s=>{const el=document.createElement('div');el.innerHTML=s||'';return el.textContent};const plain=s=>strip(s).toLocaleLowerCase();
    const search=document.querySelector('#search'),searchCount=document.querySelector('#searchCount');let searchTimer;
    const matchesQuery=(text,q)=>/^[a-z0-9]+$/i.test(q)?new RegExp(`(^|[^a-z0-9])${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}($|[^a-z0-9])`,'i').test(text):text.toLocaleLowerCase().includes(q);
    search.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{const raw=search.value.trim(),q=raw.toLocaleLowerCase();document.querySelectorAll('.markmap-node').forEach(n=>n.classList.remove('match-node','dim-node'));if(!q){searchCount.textContent='';setLevel(currentLevel,false);document.querySelector('#status').textContent='搜索已清除';return}const matches=[];walk(root,(n,path)=>{if(matchesQuery(strip(String(n.content||'')),q)){const labels=[...path.slice(1),n].map(item=>strip(String(item.content||'')).replace(/[\r\n]/g,' '));matches.push(labels.join(' › '))}});searchCount.textContent=String(matches.length);document.querySelector('#status').textContent=`找到 ${matches.length} 个节点`;const resultMarkdown=`# 搜索：${raw.replace(/[\r\n]/g,' ')}\n${matches.length?matches.map(item=>`- ${item}`).join('\n'):'- 没有匹配的节点'}`,resultRoot=transformer.transform(resultMarkdown).root;Promise.resolve(mm.setData(resultRoot)).then(()=>setTimeout(()=>mm.fit(),420));},100)});
    document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==search){e.preventDefault();search.focus()}if(e.key==='Escape'){search.value='';search.dispatchEvent(new Event('input'));search.blur()}});
    document.querySelector('#reset').onclick=()=>{search.value='';searchCount.textContent='';document.querySelectorAll('.markmap-node').forEach(n=>n.classList.remove('match-node','dim-node'));setLevel(2);setTimeout(()=>mm.fit(),450)};
    const fullButton=document.querySelector('#fullscreen');fullButton.onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.addEventListener('fullscreenchange',()=>fullButton.textContent=document.fullscreenElement?'退出全屏':'全屏');
    setLevel(2);setTimeout(()=>document.querySelector('#loading').classList.add('hidden'),700);
  </script>
